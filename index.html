<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Minecraft Tier List</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; frame-ancestors https://*.ext-twitch.tv;">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header>Minecraft Tier List</header>

  <div class="controls">
    <input id="nameInput" placeholder="Player name" />
    <button id="addBtn">Add</button>
    <button id="importBtn">Import JSON</button>
    <button id="exportBtn">Export JSON</button>
  </div>

  <input type="file" id="fileInput" accept=".json" style="display:none" />

  <main id="tiers"></main>

  <script src="script.js"></script>
</body>
</html>
